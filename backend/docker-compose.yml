services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devhouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devhouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devhouse_secret_pw}
      POSTGRES_DB: ${POSTGRES_DB:-devhouse}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devhouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: devhouse-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: devhouse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-devhouse_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-devhouse_minio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: devhouse-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: devhouse-worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - watch_inbox:/var/devhouse/watch-inbox
      - ffmpeg_scratch:/tmp/devhouse-ffmpeg

  caddy:
    image: caddy:2.8-alpine
    container_name: devhouse-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pg_data:
  redis_data:
  minio_data:
  watch_inbox:
  ffmpeg_scratch:
  caddy_data:
  caddy_config:
